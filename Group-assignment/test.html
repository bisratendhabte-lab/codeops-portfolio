<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Base Card Container */
        .ticket-card {
            width: 360px;
            background-color: #2b2b2b;
            border-radius: 28px;
            color: #ffffff;
            padding: 24px 0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .ticket-top,
        .ticket-bottom {
            padding: 0 24px;
        }

        /* Delivery Address Box */
        .address-box {
            background-color: #383838;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .address-box .label {
            font-size: 11px;
            font-weight: 700;
            color: #a0a0a0;
            letter-spacing: 1px;
        }

        .address-text {
            font-size: 13px;
            font-weight: 600;
            margin-top: 8px;
        }

        .time-text {
            font-size: 12px;
            color: #a0a0a0;
            margin-top: 6px;
        }

        /* Cart Header */
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .cart-header .title {
            font-size: 18px;
            font-weight: 600;
        }

        .cart-header .order-id {
            font-size: 12px;
            color: #888;
        }

        /* Segmented Toggle */
        .toggle-container {
            display: flex;
            background-color: #1e1e1e;
            border-radius: 30px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .toggle-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #a0a0a0;
            padding: 10px 0;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        .toggle-btn.active {
            background-color: #e53935;
            color: #fff;
            font-weight: 600;
        }

        /* Items */
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .item-name {
            font-weight: 600;
            font-size: 14px;
        }

        .item-sub {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            font-size: 14px;
        }

        .qty-controls button {
            background: none;
            border: 1px solid #555;
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
        }

        .edit-btn {
            background-color: #ffffff;
            border: none;
            border-radius: 20px;
            width: 44px;
            height: 32px;
            cursor: pointer;
        }

        /* Ticket Side Cutouts & Dashed Line Divider */
        .ticket-divider {
            position: relative;
            height: 30px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        /* Side Notches */
        .ticket-divider::before,
        .ticket-divider::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #121212;
            /* Matches body background */
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }

        .ticket-divider::before {
            left: -10px;
        }

        .ticket-divider::after {
            right: -10px;
        }

        /* Dashed Tear Line */
        .ticket-divider {
            background-image: linear-gradient(to right, #555 50%, rgba(255, 255, 255, 0) 0%);
            background-position: center;
            background-size: 12px 1px;
            background-repeat: repeat-x;
        }

        /* Bottom Promo & Totals */
        .promo-box {
            background-color: #1e1e1e;
            border-radius: 30px;
            padding: 6px 6px 6px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 24px;
        }

        .promo-btn {
            background-color: #2b2b2b;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .summary-row.total {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            margin-top: 16px;
            margin-bottom: 24px;
        }

        .confirm-btn {
            width: 100%;
            background-color: #1e1e1e;
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="ticket-card">
        <!-- Top Section: Address & Cart -->
        <div class="ticket-top">
            <div class="address-box">
                <span class="label">DELIVERY ADDRESS</span>
                <div class="address-text">📍 Po. 1478, Street No. 52, West New York</div>
                <div class="time-text">⏱ 20 min</div>
            </div>

            <div class="cart-header">
                <div class="title">🛒 Cart</div>
                <div class="order-id">Order ID: #1099</div>
            </div>

            <!-- Toggle Selector -->
            <div class="toggle-container">
                <button class="toggle-btn active">Delivery</button>
                <button class="toggle-btn">Dine In</button>
                <button class="toggle-btn">Takeaway</button>
            </div>

            <!-- Items -->
            <div class="item-row">
                <div class="item-info">
                    <div class="item-name">Pepperoni Pizza</div>
                    <div class="item-sub">Thin Crust</div>
                    <div class="qty-controls">
                        <button>-</button> <span>2</span> <button>+</button>
                    </div>
                </div>
                <button class="edit-btn">✏️</button>
            </div>

            <div class="item-row">
                <div class="item-info">
                    <div class="item-name">Cheese Burger</div>
                    <div class="item-sub">Whole wheat bun</div>
                    <div class="qty-controls">
                        <button>-</button> <span>2</span> <button>+</button>
                    </div>
                </div>
                <button class="edit-btn">✏️</button>
            </div>
        </div>

        <!-- Ticket Cutout Notch Divider -->
        <div class="ticket-divider"></div>

        <!-- Bottom Section: Promo & Totals -->
        <div class="ticket-bottom">
            <div class="promo-box">
                <span>Promotion Code</span>
                <button class="promo-btn">TRYNEW</button>
            </div>

            <div class="summary-row">
                <span>Sub Total</span>
                <span>$155.20</span>
            </div>
            <div class="summary-row">
                <span>Delivery Charge</span>
                <span>$10</span>
            </div>

            <div class="summary-row total">
                <span>TOTAL</span>
                <span>$165.20</span>
            </div>

            <button class="confirm-btn">Confirm Order</button>
        </div>
    </div>
</body>

</html>
